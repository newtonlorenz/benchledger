services:
  benchledger:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: benchledger:local
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      BENCHLEDGER_HOST: 0.0.0.0
      BENCHLEDGER_PORT: 8792
      BENCHLEDGER_PUBLIC_BASE_URL: ${BENCHLEDGER_PUBLIC_BASE_URL:?set an exact HTTP(S) public base URL}
      BENCHLEDGER_DATA_DIR: /var/lib/benchledger
      BENCHLEDGER_MAX_STORAGE_BYTES: 10737418240
      BENCHLEDGER_MAX_UPLOAD_BYTES: 104857600
    env_file:
      # Set BENCHLEDGER_ENV_FILE to an explicit private absolute path for a
      # real deployment. The relative default keeps a local checkout demo
      # convenient and is not a source-controlled secret.
      - path: ${BENCHLEDGER_ENV_FILE:-../.env}
        required: true
    ports:
      - "${BENCHLEDGER_BIND_ADDRESS:-127.0.0.1}:8792:8792"
    volumes:
      - type: bind
        source: ${BENCHLEDGER_HOST_DATA_DIR:?set an absolute private data path}
        target: /var/lib/benchledger
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "deploy/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

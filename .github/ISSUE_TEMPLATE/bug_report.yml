name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Never include private inventory, project files, order details, credentials, databases, or tokens.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Explain the expected and actual outcome in plain language.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Give the smallest sequence that reproduces the problem using demo or invented data.
      placeholder: |
        1. Start the demo workspace
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web interface
        - HTTP API
        - MCP / agent integration
        - Import
        - Deployment / backup
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser/client, Node version, and deployment method. Do not include secrets or private addresses.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I replaced all private instance data with synthetic equivalents.
          required: true
        - label: This report does not contain a security vulnerability or credential.
          required: true
